services:
  livox_mid360:
    build:
      context: .
      dockerfile: Dockerfile
    image: livox-mid360-jetson-orin:latest
    container_name: livox_mid360_container

    # Use host network for LiDAR communication
    network_mode: host
    ipc: host

    # Enable NVIDIA GPU support
    runtime: nvidia

    # Privileged mode for device access
    privileged: true

    # Environment variables
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      # Default launch behavior (override if you want RViz/recording/etc.)
      - LAUNCH_FILE=/root/livox_ws/launch/livox_driver.launch.py
      - LIVOX_CONFIG_FILE=/root/livox_ws/config/MID360_config.json

    # Volume mounts
    volumes:
      # Share configuration files
      - ./config:/root/livox_ws/config:rw
      - ./launch:/root/livox_ws/launch:rw

      # Data storage for rosbag recordings
      - ./data:/root/livox_ws/data:rw

      # Device access
      - /dev:/dev:rw

    # Restart policy
    restart: unless-stopped

    # Runs via image ENTRYPOINT (ros_entrypoint.sh). If you want a shell:
    #   docker compose exec livox_mid360 bash
    # or override with:
    #   command: ["bash"]

networks:
  default:
    driver: bridge
